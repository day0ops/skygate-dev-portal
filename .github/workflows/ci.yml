name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt
  IMAGE_NAME: skygate-portal

jobs:
  lint-test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  lint-test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v

  build-push:
    needs: [lint-test-ui, lint-test-server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  create-release:
    needs: [build-push]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release with image location
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          # The release may already exist if some other process created it
          # before this job ran; append rather than fail if so, instead of
          # clobbering its notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)
            printf '%s\n\n## Docker Image\n\n- `%s`\n' "$EXISTING" "$IMAGE" | gh release edit "${GITHUB_REF_NAME}" --notes-file -
          else
            printf '## Docker Image\n\n- `%s`\n' "$IMAGE" | gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --notes-file -
          fi
